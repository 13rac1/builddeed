[package]
name = "builddeed-checksum"
version = "0.1.2"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/13rac1/builddeed"
description = "BuildDeed Checksum: a file checksum tool sold as shareware with a BuildDeed license"

[dependencies]
# The BuildDeed SDK, pinned to a commit.
builddeed = { git = "https://github.com/13rac1/builddeed-sdk", rev = "4d5860eb93fb9f7be836241ab5ecd5b70cba7209" }
eframe = "0.32"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
builddeed = { git = "https://github.com/13rac1/builddeed-sdk", rev = "4d5860eb93fb9f7be836241ab5ecd5b70cba7209", features = ["test-support"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
debug = false
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
