[package]
name = "builddeed-checksum"
version = "0.1.2"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/13rac1/builddeed"
description = "BuildDeed Checksum: a file checksum tool sold as shareware with a BuildDeed license"

[dependencies]
eframe = "0.32"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
debug = false
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
