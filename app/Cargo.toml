[package]
name = "builddeed-checksum"
version = "0.1.2"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/13rac1/builddeed"
description = "BuildDeed Checksum: a file checksum tool sold as shareware with a BuildDeed license"

[dependencies]
# The BuildDeed SDK, pinned to a commit.
builddeed = { git = "https://github.com/13rac1/builddeed-sdk", rev = "b137b8740f271c687813a0b039a7d1629f622b8c" }
# Slint with the winit backend and the software renderer: no Qt, no GTK and
# no system GPU library.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
# Native file and folder dialogs. On Linux: the XDG desktop portal, not GTK.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
raw-window-handle = "0.6"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Slint finds the system fonts with fontique and fontconfig. With
# "fontconfig-dlopen" it loads the fontconfig library when the app starts, so
# the build needs no fontconfig headers.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
builddeed = { git = "https://github.com/13rac1/builddeed-sdk", rev = "b137b8740f271c687813a0b039a7d1629f622b8c", features = ["test-support"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
debug = false
strip = true
panic = "abort"

# "deny", not "forbid": the code that Slint generates from ui/app.slint has
# unsafe blocks with #[allow(unsafe_code)]. The code of the app has none.
[lints.rust]
unsafe_code = "deny"
